name: Update 3D contribution graph

on:
  # 首次推送这个 workflow 时自动生成一次图片，之后交给每日定时任务
  push:
    paths:
      - ".github/workflows/profile-3d.yml"
      - "conf/profile-3d-contrib.json"
  schedule:
    # 18:00 UTC = 02:00 Asia/Shanghai (next day)
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-3d
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: conf/profile-3d-contrib.json

      - name: Commit generated SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-3d-contrib
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore: update 3D contribution graph"
          git push
